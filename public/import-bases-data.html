<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="/css/modern-style.css">
  <meta charset="UTF-8">
  <title>拠点データ一括登録</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .import-container { max-width: 800px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; }
    .info-box { background: #d1ecf1; border: 1px solid #0c5460; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
    .btn-import { width: 100%; padding: 20px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; }
    .progress-box { display: none; margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 4px; }
    .progress-bar { width: 100%; height: 30px; background: #e9ecef; border-radius: 15px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { height: 100%; background: #28a745; color: white; text-align: center; line-height: 30px; }
    .log-box { max-height: 300px; overflow-y: auto; background: #fff; border: 1px solid #ddd; padding: 10px; font-family: monospace; font-size: 12px; }
    .result-box { display: none; margin-top: 20px; padding: 20px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; text-align: center; }
  </style>
</head>
<body>
  <div class="import-container">
    <h1>📦 拠点データ一括登録</h1>
    <div class="info-box">
      <strong>📊 登録予定データ:</strong> 136 拠点<br>
      <strong>📝 内容:</strong> Excel から抽出したブロック、地域、拠点の情報
    </div>
    <button id="importBtn" class="btn-import" onclick="startImport()">🚀 拠点データを一括登録する</button>
    <div id="progressBox" class="progress-box">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%">0%</div>
      </div>
      <div id="logBox" class="log-box"></div>
    </div>
    <div id="resultBox" class="result-box">
      <h3>✅ 登録完了!</h3>
      <p id="resultMessage"></p>
      <button onclick="goToBaseMaster()" class="btn-primary">拠点マスタ管理画面へ</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/import-bases-data.js"></script>
</body>
</html>
