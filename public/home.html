<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="/css/modern-style.css">
  <link rel="stylesheet" href="/css/home-enhanced.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <title>ホーム - 拠点資産シェアシステム</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 1rem;
    }
    .filter-chip {
      padding: 10px 20px;
      font-size: 15px;
      min-width: auto;
      white-space: nowrap;
      background: white;
      border: 2px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .filter-chip:hover {
      border-color: #1976d2;
      background: #e3f2fd;
    }
    .filter-chip.active {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div class="header-title">📦 拠点資産シェアシステム</div>
      <div class="header-user">
        <div class="header-user-info" id="userInfo">
          <div class="header-user-name">読み込み中...</div>
          <div class="header-user-base"></div>
        </div>
        <button class="btn" style="padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px;" onclick="location.href='/statistics.html'">📊 統計</button>
        <button class="btn" onclick="location.href='/notifications.html'" style="padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px; position: relative;">🔔 通知<span id="notificationBadge" style="display: none; position: absolute; top: -5px; right: -5px; background: #f44336; color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; min-width: 20px; height: 20px; align-items: center; justify-content: center;"></span></button>
        <button class="btn" onclick="location.href='/user-register.html'" style="padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px;">⚙️ 設定</button>
        <button class="btn" onclick="location.href='/user-manual.html'" style="padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px;">📚 マニュアル</button>
        <button id="adminManualBtn" class="btn" style="display: none; padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px;" onclick="location.href='/admin-manual.html'">🔧 管理者マニュアル</button>
        <button id="adminInventoryBtn" class="btn" style="display: none; padding: 8px 16px; font-size: 14px; background: white; color: #1976d2; border: 2px solid #1976d2; border-radius: 25px; margin-right: 10px;" onclick="location.href='/admin-inventory.html'">📊 棚卸実施状況</button>

        <button class="btn" style="padding: 8px 16px; font-size: 14px; background: #1976d2; color: white; border: 2px solid white;" onclick="signOut()">
          ログアウト
        </button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 資産を検索..." class="search-input">
    </div>
    <!-- タブ切り替え -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e0e0e0;">
      <button id="tabRegistered" class="main-tab-btn active" style="padding: 10px 20px; border: none; border-bottom: 3px solid #1976d2; background: none; cursor: pointer; font-weight: 600; color: #1976d2;">登録資産</button>
      <button id="tabForTransfer" class="main-tab-btn" style="padding: 10px 20px; border: none; border-bottom: 3px solid transparent; background: none; cursor: pointer; font-weight: 600; color: #666;">譲渡申請資産</button>
      <button onclick="location.href='/transfer-list.html'" class="transfer-list-btn">📋 譲渡申請一覧</button>
      <button onclick="window.location.href='/inventory.html';" class="main-tab-btn transfer-list-btn" style="padding: 10px 20px; border: none; cursor: pointer; border-radius: 8px; font-weight: 600; margin-left: 10px; background: #f5f5f5; border: 2px solid #e0e0e0; color: #333; transition: all 0.3s ease;">📦 棚卸</button>
      <button onclick="exportCSV();" class="main-tab-btn transfer-list-btn" style="padding: 10px 20px; border: none; cursor: pointer; border-radius: 8px; font-weight: 600; margin-left: 10px; background: #f5f5f5; border: 2px solid #e0e0e0; color: #333; transition: all 0.3s ease;">📥 CSVダウンロード</button>


      <div style="flex: 1;"></div>
      <button id="tabMyBase" class="tab-btn active" style="padding: 10px 20px; border: none; border-bottom: 3px solid #1976d2; background: none; cursor: pointer; font-weight: 600; color: #1976d2;">自拠点の資産</button>
      <button id="tabAllBases" class="tab-btn" style="padding: 10px 20px; border: none; border-bottom: 3px solid transparent; background: none; cursor: pointer; font-weight: 600; color: #666;">全拠点の資産</button>
    </div>

    <!-- 拠点フィルター -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
      <span style="font-weight: 600; color: #666;">拠点で絞り込み:</span>
      <select id="blockFilter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;">
        <option value="">すべてのブロック</option>
      </select>
      <select id="regionFilter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;" disabled>
        <option value="">すべての地域</option>
      </select>
      <select id="baseFilter" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;" disabled>
        <option value="">すべての拠点</option>
      </select>
      <button id="clearBaseFilter" style="padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; background: #f5f5f5; cursor: pointer; display: none;">クリア</button>
    </div>

    <div class="filter-chips">
      <button class="filter-chip active" data-filter="all">すべて</button>
      <button class="filter-chip" data-filter="PC・IT機器">PC・IT機器</button>
      <button class="filter-chip" data-filter="机">机</button>
      <button class="filter-chip" data-filter="椅子">椅子</button>
      <button class="filter-chip" data-filter="事務用品・備品">事務用品・備品</button>
      <button class="filter-chip" data-filter="什器等">什器等</button>
      <button class="filter-chip" data-filter="媒体">媒体</button>
      <button class="filter-chip" data-filter="デポ備品">デポ備品</button>
      <button class="filter-chip" data-filter="その他">その他</button>
    </div>

    <div class="sort-buttons">
      <button class="sort-btn active" data-sort="newest">新着順</button>
      <button class="sort-btn" data-sort="oldest">登録順</button>
      <button class="sort-btn" data-sort="name">名前順</button>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>

    <div id="itemList" class="item-grid" style="display: none;"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">📦</div>
      <p class="empty-message">登録された資産がありません</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/home.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">ホーム</span>
    </a>
    <a href="/asset-register.html" class="nav-item">
      <span class="nav-icon">➕</span>
      <span class="nav-label">資産登録</span>
    </a>
    <a href="/my-items.html" class="nav-item">
      <span class="nav-icon">📦</span>
      <span class="nav-label">登録資産</span>
    </a>
    <a href="/transfer-approval.html" class="nav-item">
      <span class="nav-icon">✅</span>
      <span class="nav-label">譲渡承認</span>
    </a>
    <a href="/expense-transfer.html" class="nav-item">
      <span class="nav-icon">💰</span>
      <span class="nav-label">経費振替</span>
    </a>
  </nav>

  <script src="/js/config.js"></script>
  <script src="/js/error-handler.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/home.js?v=3"></script>
  <script src="/js/csv-export.js"></script>



</body>
</html>
