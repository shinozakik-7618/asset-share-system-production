<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="/css/modern-style.css">
  <link rel="stylesheet" href="/css/list-detail-enhanced.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <title>資産詳細 - 拠点資産シェアシステム</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  
  <style>
    .detail-container { max-width: 800px; margin: 0 auto; padding: 1rem; }
    .detail-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .detail-image { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .no-image-large { background: #f5f5f5; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3rem; border-radius: 8px; border: 1px solid #ddd; }
    .detail-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .detail-section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; border-bottom: 2px solid #1976d2; padding-bottom: 0.5rem; }
    .detail-row { display: flex; padding: 0.75rem 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-weight: bold; width: 120px; color: #666; }
    .detail-value { flex: 1; color: #333; }
    .qr-section { text-align: center; padding: 1.5rem; }
    .qr-image { max-width: 200px; margin: 1rem auto; }
    .action-buttons { display: flex; gap: 1rem; margin-top: 2rem; }
    @media print { .action-buttons, .bottom-nav, header { display: none; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div class="header-title">📦 資産詳細</div>
    </div>
  </header>

  <main class="container main-content">
    <div class="detail-container">
      <div id="assetImages" class="detail-images"></div>
      
      <div class="detail-card">
        <h2 class="detail-section-title">基本情報</h2>
        <div class="detail-row"><div class="detail-label">品名</div><div class="detail-value" id="itemName">-</div></div>
        <div class="detail-row"><div class="detail-label">大分類</div><div class="detail-value" id="largeCategory">-</div></div>
        <div class="detail-row"><div class="detail-label">中分類</div><div class="detail-value" id="mediumCategory">-</div></div>
        <div class="detail-row"><div class="detail-label">数量</div><div class="detail-value" id="quantity">-</div></div>
      </div>
      
      <div class="detail-card">
        <h2 class="detail-section-title">登録者情報</h2>
        <div class="detail-row"><div class="detail-label">登録者</div><div class="detail-value" id="ownerName">-</div></div>
        <div class="detail-row"><div class="detail-label">拠点</div><div class="detail-value" id="ownerBase">-</div></div>
        <div class="detail-row"><div class="detail-label">地域</div><div class="detail-value" id="ownerRegion">-</div></div>
        <div class="detail-row"><div class="detail-label">ブロック</div><div class="detail-value" id="ownerBlock">-</div></div>
        <div class="detail-row"><div class="detail-label">登録日</div><div class="detail-value" id="createdAt">-</div></div>
      </div>
      
      <div class="detail-card qr-section">
        <h2 class="detail-section-title">QRコード</h2>
        <img id="qrCodeImage" class="qr-image" alt="QRコード">
      </div>
      
      <div class="action-buttons">
        <button class="btn btn-primary" style="flex: 1;" onclick="requestTransfer()">🔄 譲渡を申請する</button>
        <button class="btn btn-secondary" onclick="printQRCode()">🖨️ 印刷</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/home.html" class="nav-item"><span class="nav-icon">🏠</span><span>ホーム</span></a>
    <a href="/asset-register.html" class="nav-item"><span class="nav-icon">➕</span><span>登録</span></a>
    <a href="/my-items.html" class="nav-item"><span class="nav-icon">📋</span><span>管理</span></a>
  </nav>

  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/asset-detail.js"></script>
</body>
</html>
